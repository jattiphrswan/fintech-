    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('payline-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved
          : typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f5f8fc' : '#080b14';
      })();
    </script>
